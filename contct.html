<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='contact.css'>
    <title>Contact - Shivam Joshi</title>
</head>
<body align='center'>
    <nav id='navbar'>
        <ul>
            <li class='item'><a href='index.html'>Home</a></li>
            <li class='item'><a href='about.html'>About me</a></li>
            <li class='item'><a href='contct.html'>Contact me</a></li>
            <li class='item'>
                <button id='darkModeToggle' style='background-color: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer;'>🌙</button>
            </li>
        </ul>
    </nav>
    <div class='contact-container'>
        <div class='contact-card'>
            <h2>Get in Touch</h2>
            <form id='contact-form'>
                <div class='form-group'>
                    <label for='name'>Full Name</label>
                    <input type='text' id='name' name='name' placeholder='Your Name' required>
                </div>
                <div class='form-group'>
                    <label for='email'>Email Address</label>
                    <input type='email' id='email' name='email' placeholder='Your Email' required>
                </div>
                <div class='form-group'>
                    <label for='subject'>Subject</label>
                    <input type='text' id='subject' name='subject' placeholder='Subject' required>
                </div>
                <div class='form-group'>
                    <label for='message'>Message</label>
                    <textarea id='message' name='message' rows='5' placeholder='Your Message' required></textarea>
                </div>
                <button type='submit' class='btn-send'>Send Message</button>
            </form>
        </div>
    </div>
    <script src='didi.js'></script>
</body>
</html>
